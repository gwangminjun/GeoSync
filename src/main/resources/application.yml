# 토지 증분 동기화 (토지이동 변동내역 §10 일일 + 토지기본정보 TXT 월 보정).
# kras 블록 밖에 둔다 — 설정 화면에서 저장하면 kras 블록이 통째로 화면 항목으로 교체되기 때문이다.
# 서비스 ID·요청 필드명은 배포 시 확인해 conf/application.yml에 채운다. 변경 후 재시작해야 적용된다.
kras-incremental:
  land-change:
    service-id: ""          # land_change 서비스 ID. kras.sync_dataset.service_code와 같은 값. 비우면 호출 안 함
    start-param: ""         # 처리일자(시작일) 요청 필드명
    end-param: ""           # 처리일자(종료일) 요청 필드명
    date-format: "yyyyMMdd"
    schedule: ""            # 일일 증분 cron, 비우면 꺼짐. 제안: "0 0 6 * * *"
  land-basic:
    correction-schedule: "" # 월 보정 cron, 비우면 꺼짐. 제안: "0 0 2 1 * *"

koreps:
  url: "http://10.188.226.221:8385/conn/estateGateway"
  conn-sys-id: "VUHK-MFG4-XUME-M9AO"

# 개발 환경 전용 mock estateGateway (/mock/estateGateway).
# true로 켜면 API 테스트 화면에서 실 게이트웨이 없이 테스트할 수 있다.
mock:
  gateway:
    enabled: false

# /conn·/svc 요청 로그 보존기간 (0 이하면 정리 안 함)
conn-log:
  retention-days: 90

ods:
  schema: "ods"
  schedule: "0 30 5 * * *"

sync:
  org-code: "12830"
  enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: "./logs/geosync.log"
  logback:
    rollingpolicy:
      file-name-pattern: "./logs/geosync.%d{yyyy-MM-dd}.log"
      max-history: 90
  level:
    root: INFO
    geosync: DEBUG
