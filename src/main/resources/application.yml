server:
  port: ${SERVER_PORT:18080}

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://110.20.1.218:1990/ygspdb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
  main:
    banner-mode: off

kras:
  url: ${KRAS_URL:http://110.20.1.12:8385/conn/estateGateway}
  conn-svc-id: ${KRAS_CONN_SVC_ID:KRAS000037}
  conn-sys-id: ${KRAS_CONN_SYS_ID:HOH4-N9PX-73Y6-B393}
  chk-pnu: ${KRAS_CHK_PNU:4687025625111190010}
  config: ${KRAS_CONFIG:conf/kras/base-tables.xml}
  schedule: ${KRAS_SCHEDULE:0 30 4 * * *}
  timeout-seconds: 300
  api-timeout-seconds: 30
  work-dir: ${KRAS_WORK_DIR:./workspace/kras}
  shp-charset: ${KRAS_SHP_CHARSET:MS949}
  file-download:
    schedule: ${KRAS_FILE_DOWNLOAD_SCHEDULE:}
    output-dir: ${KRAS_FILE_DOWNLOAD_DIR:}
    cbnd-shp: true
    usezone-shp: true
    jiga-txt: false
    land-txt: false

koreps:
  url: ${KOREPS_URL:http://10.188.226.221:8385/conn/estateGateway}
  conn-sys-id: ${KOREPS_CONN_SYS_ID:VUHK-MFG4-XUME-M9AO}

# 개발 환경 전용 mock estateGateway (/mock/estateGateway).
# true로 켜면 API 테스트 화면에서 실 게이트웨이 없이 테스트할 수 있다.
mock:
  gateway:
    enabled: ${MOCK_GATEWAY:false}

# /conn·/svc 요청 로그 보존기간 (0 이하면 정리 안 함)
conn-log:
  retention-days: ${CONN_LOG_RETENTION_DAYS:90}

ods:
  schema: ${ODS_SCHEMA:ods}
  schedule: ${ODS_SCHEDULE:0 30 5 * * *}

sync:
  org-code: ${SYNC_ORG_CODE:46870}
  enabled: ${SYNC_ENABLED:true}

targets: []

logging:
  charset:
    console: UTF-8
    file: UTF-8
  file:
    name: ${LOG_DIR:./logs}/geomex-sync.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:./logs}/geomex-sync.%d{yyyy-MM-dd}.log
      max-history: 90
  level:
    root: INFO
    geomex.sync: DEBUG
