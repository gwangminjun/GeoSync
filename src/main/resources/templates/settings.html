<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="ko">
<head>
  <title>설정</title>
  <th:block layout:fragment="head">
  <style>
    .gs-input {
      width:100%; padding:8px 10px; border-radius:7px;
      border:1px solid #2e3640; background:#1a1f26; color:#e7eaee;
      font-size:13px; font-family:inherit; box-sizing:border-box;
      transition:border-color .15s;
    }
    .gs-input:focus { border-color:#0e9b94; outline:none; }
    .gs-input.mono { font-family:'JetBrains Mono',monospace; }
    .gs-label { font-size:12px; color:#9aa2ad; font-weight:600; margin-bottom:5px; display:block; }
    .gs-section { font-size:11.5px; font-weight:700; color:#69707b; letter-spacing:.06em;
                  border-bottom:1px solid #262c35; padding-bottom:8px; text-transform:uppercase; }
    /* targets table */
    .tgt-table { width:100%; border-collapse:collapse; font-size:12.5px; }
    .tgt-table th { padding:7px 8px; color:#69707b; font-weight:600; text-align:left;
                    border-bottom:1px solid #262c35; white-space:nowrap; }
    .tgt-table td { padding:5px 5px; vertical-align:middle; }
    .tgt-table tr.tgt-row:hover td { background:#1a1f26; }
    /* buttons */
    .btn-ghost { border:1px solid #2e3640; background:#1a1f26; color:#9aa2ad; cursor:pointer;
                 padding:7px 14px; border-radius:7px; font-size:12.5px; font-family:inherit; white-space:nowrap; }
    .btn-ghost:hover { border-color:#0e9b94; color:#0e9b94; }
    .btn-danger { border:1px solid #3d2a2a; background:transparent; color:#e88a82; cursor:pointer;
                  padding:5px 10px; border-radius:7px; font-size:12px; font-family:inherit; }
    .btn-danger:hover { background:#2a1a1a; }
    .btn-teal { border:none; background:#0e9b94; color:#fff; cursor:pointer;
                padding:10px 22px; border-radius:8px; font-size:13.5px; font-weight:600; font-family:inherit; }
    /* schedule picker */
    .sched-wrap { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
    .sched-time { width:110px !important; }
    .sched-cron { font-family:'JetBrains Mono',monospace; font-size:12px; color:#69707b;
                  background:#14171c; padding:5px 10px; border-radius:6px; border:1px solid #262c35; white-space:nowrap; }
    .sched-raw { display:none; width:200px !important; }
    .sched-toggle { font-size:11.5px; color:#69707b; cursor:pointer; text-decoration:underline; }
    .sched-toggle:hover { color:#9aa2ad; }
    .test-result { font-size:12.5px; font-family:'JetBrains Mono',monospace; }
  </style>
  </th:block>
</head>
<body>
<main layout:fragment="content">

  <div style="margin-bottom:20px;">
    <div style="font-size:19px;font-weight:700;color:#f3f5f7;letter-spacing:-0.01em;">설정 관리</div>
    <div style="font-size:12px;color:#69707b;margin-top:4px;font-family:'JetBrains Mono',monospace;"
         th:text="'설정 파일: ' + ${configPath}"></div>
  </div>

  <div th:if="${success}"
       style="margin-bottom:16px;padding:12px 16px;border-radius:9px;background:#1a2a1e;border:1px solid #2a3d2e;font-size:13px;color:#5fc98a;"
       th:text="${success}"></div>
  <div th:if="${error}"
       style="margin-bottom:16px;padding:12px 16px;border-radius:9px;background:#2a1a1a;border:1px solid #3d2a2a;font-size:13px;color:#e88a82;"
       th:text="${error}"></div>

  <form method="post" th:action="@{/settings}" id="settings-form"
        style="display:flex;flex-direction:column;gap:26px;">

    <!-- ── 대상 DB 서버 ── -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div class="gs-section" style="border:none;padding:0;">대상 DB 서버</div>
        <button type="button" class="btn-ghost" onclick="addTargetRow()">+ 추가</button>
      </div>
      <div style="overflow-x:auto;">
        <table class="tgt-table">
          <thead>
            <tr>
              <th>이름</th><th>호스트 (IP)</th><th style="width:70px;">포트</th>
              <th>데이터베이스</th><th>사용자</th><th>비밀번호</th>
              <th style="width:44px;text-align:center;">활성</th><th style="width:160px;"></th>
            </tr>
          </thead>
          <tbody id="tgt-tbody">
            <tr th:each="t,i : ${targets}" class="tgt-row" th:attr="data-idx=${i.index}">
              <td><input class="gs-input" type="text"
                         th:name="'tgt_name_' + ${i.index}" th:value="${t.name}" placeholder="메인DB"></td>
              <td><input class="gs-input mono" type="text"
                         th:name="'tgt_host_' + ${i.index}" th:value="${t.host}"></td>
              <td><input class="gs-input mono" type="text"
                         th:name="'tgt_port_' + ${i.index}" th:value="${t.port}"></td>
              <td><input class="gs-input mono" type="text"
                         th:name="'tgt_dbname_' + ${i.index}" th:value="${t.dbname}"></td>
              <td><input class="gs-input" type="text"
                         th:name="'tgt_user_' + ${i.index}" th:value="${t.username}"></td>
              <td><input class="gs-input mono" type="password"
                         th:name="'tgt_pass_' + ${i.index}" th:value="${t.password}"></td>
              <td style="text-align:center;">
                <input type="checkbox" th:name="'tgt_enabled_' + ${i.index}"
                       th:checked="${t.enabled}"
                       style="width:16px;height:16px;accent-color:#0e9b94;cursor:pointer;">
              </td>
              <td style="white-space:nowrap;">
                <button type="button" class="btn-ghost"
                        th:onclick="'testTarget(' + ${i.index} + ')'">테스트</button>
                <button type="button" class="btn-danger"
                        onclick="removeRow(this)">✕</button>
                <span th:id="'res-' + ${i.index}" class="test-result"></span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <input type="hidden" name="tgt_count" id="tgt_count"
             th:value="${#lists.size(targets)}">
    </div>

    <!-- ── KRAS ── -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="gs-section">ODS</div>
      <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;">
        <div style="max-width:260px;flex:1;">
          <label class="gs-label">ODS Schema</label>
          <input class="gs-input mono" type="text" name="ods_schema" id="ods_schema"
                 th:value="${values['ods_schema']}" placeholder="ods">
        </div>
        <div style="flex:3;min-width:280px;">
          <label class="gs-label">대상 DB 확인</label>
          <div id="ods-target-tabs" style="display:flex;gap:8px;flex-wrap:wrap;">
            <button th:each="t,i : ${targets}" type="button" class="btn-ghost"
                    th:onclick="'checkOdsSchema(' + ${i.index} + ')'"
                    th:text="${t.name != null && !#strings.isEmpty(t.name) ? t.name : 'DB ' + (i.index + 1)}">DB</button>
          </div>
        </div>
      </div>
      <div id="ods-check-result"
           style="display:none;border:1px solid #262c35;border-radius:8px;background:#171b21;padding:12px;overflow-x:auto;"></div>
      <div th:if="${#lists.isEmpty(targets)}" style="font-size:12.5px;color:#d9b066;">
        대상 DB를 먼저 추가하고 저장한 뒤 확인할 수 있습니다.
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="gs-section">KRAS</div>

      <!-- URL + 연결ID + 연결테스트 -->
      <div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap;">
        <div style="flex:3;min-width:220px;">
          <label class="gs-label">KRAS URL</label>
          <input class="gs-input mono" type="text" name="kras_url" id="kras_url"
                 th:value="${values['kras_url']}">
        </div>
        <div style="flex:2;min-width:160px;">
          <label class="gs-label">연결 시스템 ID</label>
          <input class="gs-input mono" type="text" name="kras_conn_sys_id" id="kras_conn_sys_id"
                 th:value="${values['kras_conn_sys_id']}">
        </div>
        <div style="flex:2;min-width:160px;">
          <label class="gs-label">확인 PNU</label>
          <input class="gs-input mono" type="text" name="kras_chk_pnu" id="kras_chk_pnu"
                 th:value="${values['kras_chk_pnu']}">
        </div>
        <div style="flex-shrink:0;display:flex;align-items:center;gap:8px;padding-bottom:1px;">
          <button type="button" class="btn-ghost" onclick="testKras()">KRAS 연결 테스트</button>
          <span id="kras-test-result" class="test-result"></span>
        </div>
      </div>

      <!-- 스케줄 -->
      <div>
        <label class="gs-label">실행 스케줄</label>
        <div class="sched-wrap">
          <span style="font-size:13px;color:#9aa2ad;">매일</span>
          <input type="time" class="gs-input sched-time" id="kras_time">
          <span style="font-size:13px;color:#9aa2ad;">실행</span>
          <span class="sched-cron" id="kras_cron_display">-</span>
          <span class="sched-toggle" onclick="toggleRaw('kras')">고급 설정</span>
          <input type="text" class="gs-input mono sched-raw" id="kras_raw"
                 placeholder="0 30 4 * * *">
          <input type="hidden" name="kras_schedule" id="kras_schedule">
        </div>
      </div>

    </div>

    <!-- ── KAIS ── -->
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="gs-section">KAIS</div>
      <div style="flex:2;min-width:220px;">
        <label class="gs-label">KAIS 작업 디렉토리</label>
        <input class="gs-input mono" type="text" name="kais_work_dir"
               th:value="${values['kais_work_dir']}" placeholder="./KAIS_WORK">
      </div>

      <!-- 스케줄 -->
      <div>
        <label class="gs-label">실행 스케줄</label>
        <div class="sched-wrap">
          <span style="font-size:13px;color:#9aa2ad;">매일</span>
          <input type="time" class="gs-input sched-time" id="kais_time">
          <span style="font-size:13px;color:#9aa2ad;">실행</span>
          <span class="sched-cron" id="kais_cron_display">-</span>
          <span class="sched-toggle" onclick="toggleRaw('kais')">고급 설정</span>
          <input type="text" class="gs-input mono sched-raw" id="kais_raw"
                 placeholder="0 30 3 * * *">
          <input type="hidden" name="kais_schedule" id="kais_schedule">
        </div>
      </div>
    </div>

    <!-- 저장 버튼 -->
    <div style="display:flex;gap:10px;padding-top:4px;">
      <button type="submit" class="btn-teal">저장</button>
      <a th:href="@{/settings}"
         style="cursor:pointer;padding:10px 22px;border-radius:8px;font-size:13.5px;font-weight:600;
                font-family:inherit;background:transparent;color:#9aa2ad;border:1px solid #2e3640;">
        취소</a>
    </div>

  </form>
</main>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
  /* ── 초기값 (Thymeleaf 주입) ───────────────────────────────── */
  let rowCount   = [[${#lists.size(targets)}]];
  const initKrasCron = [[${values['kras_schedule']}]] || '';
  const initKaisCron = [[${values['kais_schedule']}]] || '';

  /* ── cron ↔ time 변환 ─────────────────────────────────────── */
  function timeToCron(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    return `0 ${m} ${h} * * *`;
  }

  function cronToTime(cron) {
    if (!cron) return null;
    const parts = cron.trim().split(/\s+/);
    if (parts.length >= 3 && parts[3] === '*' && parts[4] === '*') {
      const m = parseInt(parts[1]), h = parseInt(parts[2]);
      if (!isNaN(h) && !isNaN(m))
        return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
    }
    return null;
  }

  function initSchedule(key, cron) {
    const time = cronToTime(cron);
    if (time) {
      document.getElementById(key + '_time').value = time;
      document.getElementById(key + '_cron_display').textContent = cron || '-';
      document.getElementById(key + '_schedule').value = cron;
    } else if (cron) {
      // 단순 daily 아님 → 고급 모드로 초기화
      showRaw(key, cron);
    }
  }

  function updateCron(key) {
    const t = document.getElementById(key + '_time').value;
    const cron = timeToCron(t);
    document.getElementById(key + '_cron_display').textContent = cron;
    document.getElementById(key + '_schedule').value = cron;
  }

  /* ── 고급 모드 토글 ────────────────────────────────────────── */
  function showRaw(key, value) {
    document.getElementById(key + '_time').parentElement.querySelector('.sched-wrap').style.display;
    document.getElementById(key + '_time').style.display = 'none';
    document.getElementById(key + '_cron_display').style.display = 'none';
    document.getElementById(key + '_raw').style.display = 'block';
    document.getElementById(key + '_raw').value = value || document.getElementById(key + '_schedule').value;
    document.querySelectorAll('#' + key + '_time').forEach(e => e.previousElementSibling && (e.previousElementSibling.style.display='none'));
  }

  function toggleRaw(key) {
    const rawEl   = document.getElementById(key + '_raw');
    const timeEl  = document.getElementById(key + '_time');
    const cronEl  = document.getElementById(key + '_cron_display');
    const isRaw   = rawEl.style.display !== 'none';

    if (isRaw) {
      // 고급 → 시간 picker
      const time = cronToTime(rawEl.value);
      if (!time) { alert('매일 1회 실행 cron 만 시간 선택으로 전환 가능합니다.\n예: 0 30 4 * * *'); return; }
      rawEl.style.display = 'none';
      timeEl.style.display = '';
      cronEl.style.display = '';
      timeEl.value = time;
      updateCron(key);
      // 레이블 앞뒤 span 복원
      setDailySpansVisible(key, true);
    } else {
      rawEl.style.display = 'block';
      timeEl.style.display = 'none';
      cronEl.style.display = 'none';
      setDailySpansVisible(key, false);
      rawEl.value = document.getElementById(key + '_schedule').value;
    }
  }

  function setDailySpansVisible(key, visible) {
    const wrap = document.getElementById(key + '_time').closest('.sched-wrap');
    if (!wrap) return;
    wrap.querySelectorAll('span').forEach(s => {
      if (s.classList.contains('sched-cron') || s.classList.contains('sched-toggle')) return;
      s.style.display = visible ? '' : 'none';
    });
  }

  /* ── 폼 제출 전 cron 값 확정 ───────────────────────────────── */
  document.getElementById('settings-form').addEventListener('submit', function() {
    ['kras','kais'].forEach(key => {
      const rawEl  = document.getElementById(key + '_raw');
      const timeEl = document.getElementById(key + '_time');
      const hidden = document.getElementById(key + '_schedule');
      if (rawEl.style.display !== 'none') {
        hidden.value = rawEl.value.trim();
      } else {
        hidden.value = timeToCron(timeEl.value);
      }
    });
  });

  /* ── DB 대상 테이블 ────────────────────────────────────────── */
  function addTargetRow() {
    const idx = rowCount++;
    document.getElementById('tgt_count').value = rowCount;
    const tr = document.createElement('tr');
    tr.className = 'tgt-row';
    tr.dataset.idx = idx;
    tr.innerHTML = `
      <td><input class="gs-input" type="text" name="tgt_name_${idx}" placeholder="메인DB"></td>
      <td><input class="gs-input mono" type="text" name="tgt_host_${idx}"></td>
      <td><input class="gs-input mono" type="text" name="tgt_port_${idx}" value="5432"></td>
      <td><input class="gs-input mono" type="text" name="tgt_dbname_${idx}"></td>
      <td><input class="gs-input" type="text" name="tgt_user_${idx}"></td>
      <td><input class="gs-input mono" type="password" name="tgt_pass_${idx}"></td>
      <td style="text-align:center;">
        <input type="checkbox" name="tgt_enabled_${idx}" checked
               style="width:16px;height:16px;accent-color:#0e9b94;cursor:pointer;">
      </td>
      <td style="white-space:nowrap;">
        <button type="button" class="btn-ghost" onclick="testTarget(${idx})">테스트</button>
        <button type="button" class="btn-danger" onclick="removeRow(this)">✕</button>
        <span id="res-${idx}" class="test-result"></span>
      </td>`;
    document.getElementById('tgt-tbody').appendChild(tr);
  }

  function removeRow(btn) {
    btn.closest('tr').remove();
    reindex();
  }

  function reindex() {
    const rows = document.querySelectorAll('#tgt-tbody tr.tgt-row');
    rows.forEach((tr, newIdx) => {
      tr.dataset.idx = newIdx;
      tr.querySelectorAll('input[name]').forEach(el => {
        el.name = el.name.replace(/_\d+$/, '_' + newIdx);
      });
      const resSpan = tr.querySelector('[id^="res-"]');
      if (resSpan) resSpan.id = 'res-' + newIdx;
      const testBtn = tr.querySelector('button.btn-ghost');
      if (testBtn) testBtn.setAttribute('onclick', 'testTarget(' + newIdx + ')');
    });
    rowCount = rows.length;
    document.getElementById('tgt_count').value = rowCount;
  }

  /* ── 연결 테스트 공통 ──────────────────────────────────────── */
  function callTest(endpoint, body, resultEl) {
    resultEl.textContent = '테스트 중…';
    resultEl.style.color = '#69707b';
    fetch(endpoint, { method:'POST', body })
      .then(r => r.json())
      .then(d => {
        resultEl.textContent = d.success ? '✓ ' + d.message : '✗ ' + d.message;
        resultEl.style.color  = d.success ? '#5fc98a' : '#e88a82';
      })
      .catch(() => { resultEl.textContent = '✗ 요청 실패'; resultEl.style.color = '#e88a82'; });
  }

  function testTarget(idx) {
    const host   = document.querySelector(`[name=tgt_host_${idx}]`).value.trim();
    const port   = document.querySelector(`[name=tgt_port_${idx}]`).value.trim() || '5432';
    const dbname = document.querySelector(`[name=tgt_dbname_${idx}]`).value.trim();
    const user   = document.querySelector(`[name=tgt_user_${idx}]`).value.trim();
    const pw     = document.querySelector(`[name=tgt_pass_${idx}]`).value;
    const res    = document.getElementById('res-' + idx);
    if (!host || !dbname || !user) {
      res.textContent = '호스트/DB/사용자 필수'; res.style.color = '#d9b066'; return;
    }
    const b = new FormData();
    b.append('db_host',host); b.append('db_port',port); b.append('db_name',dbname);
    b.append('db_user',user); b.append('db_password',pw);
    callTest('/settings/test-db', b, res);
  }

  function testKras() {
    const url    = document.getElementById('kras_url').value.trim();
    const connId = document.getElementById('kras_conn_sys_id').value.trim();
    const chkPnu = document.getElementById('kras_chk_pnu').value.trim();
    const res    = document.getElementById('kras-test-result');
    if (!url || !connId) {
      res.textContent = 'URL과 연결 시스템 ID를 입력하세요'; res.style.color = '#d9b066'; return;
    }
    const b = new FormData();
    b.append('kras_url', url);
    b.append('kras_conn_sys_id', connId);
    b.append('kras_chk_pnu', chkPnu);
    callTest('/settings/test-kras', b, res);
  }

  function checkOdsSchema(targetIndex) {
    const schema = document.getElementById('ods_schema').value.trim() || 'ods';
    const box = document.getElementById('ods-check-result');
    box.style.display = 'block';
    box.innerHTML = '<div style="font-size:12.5px;color:#69707b;">checking...</div>';

    const body = new FormData();
    body.append('target_index', targetIndex);
    body.append('ods_schema', schema);

    fetch('/settings/check-ods', { method:'POST', body })
      .then(r => r.json())
      .then(d => {
        if (!d.success) {
          box.innerHTML = `<div style="font-size:12.5px;color:#e88a82;">${escapeHtml(d.message || 'check failed')}</div>`;
          return;
        }
        const rows = (d.tables || []).map(t => `
          <tr>
            <td style="padding:7px 8px;color:#cdd3db;font-family:'JetBrains Mono',monospace;">${escapeHtml(t.name)}</td>
            <td style="padding:7px 8px;text-align:right;color:#e7eaee;font-family:'JetBrains Mono',monospace;">${Number(t.totalRows || 0).toLocaleString()}</td>
            <td style="padding:7px 8px;text-align:right;color:#e7eaee;font-family:'JetBrains Mono',monospace;">${t.orgRows === null || t.orgRows === undefined ? '-' : Number(t.orgRows).toLocaleString()}</td>
          </tr>`).join('');
        box.innerHTML = `
          <div style="display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;">
            <div style="font-size:13px;color:#cdd3db;font-weight:600;">${escapeHtml(d.target)} / ${escapeHtml(d.schema)}</div>
            <div style="font-size:12px;color:${d.schemaExists ? '#5fc98a' : '#e88a82'};">${d.schemaExists ? 'schema exists' : 'schema missing'}</div>
          </div>
          ${d.schemaExists ? `
          <table class="tgt-table">
            <thead><tr><th>Table</th><th style="text-align:right;">Total rows</th><th style="text-align:right;">org_cd rows</th></tr></thead>
            <tbody>${rows || '<tr><td colspan="3" style="padding:10px;color:#69707b;">No tables</td></tr>'}</tbody>
          </table>` : ''}
        `;
      })
      .catch(() => {
        box.innerHTML = '<div style="font-size:12.5px;color:#e88a82;">request failed</div>';
      });
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  document.addEventListener('DOMContentLoaded', function() {
    initSchedule('kras', initKrasCron);
    initSchedule('kais', initKaisCron);

    document.getElementById('kras_time').addEventListener('change', () => updateCron('kras'));
    document.getElementById('kais_time').addEventListener('change', () => updateCron('kais'));
    document.getElementById('kras_raw').addEventListener('input', function() {
      document.getElementById('kras_schedule').value = this.value;
    });
    document.getElementById('kais_raw').addEventListener('input', function() {
      document.getElementById('kais_schedule').value = this.value;
    });
  });
</script>
</th:block>
</body>
