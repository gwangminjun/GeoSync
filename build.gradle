plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'geomex'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

ext {
    geotoolsVersion = '31.1'
}

repositories {
    mavenCentral()
    maven { url 'https://repo.osgeo.org/repository/release/' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'

    // GeoTools: SHP 읽기 + EPSG 좌표변환 (JAI 래스터 처리 불필요하므로 제외)
    implementation("org.geotools:gt-shapefile:${geotoolsVersion}") {
        exclude group: 'javax.media', module: 'jai_core'
        exclude group: 'javax.media', module: 'jai_codec'
        exclude group: 'javax.media', module: 'jai_imageio'
    }
    implementation("org.geotools:gt-referencing:${geotoolsVersion}") {
        exclude group: 'javax.media', module: 'jai_core'
        exclude group: 'javax.media', module: 'jai_codec'
    }
    implementation("org.geotools:gt-epsg-hsql:${geotoolsVersion}") {
        exclude group: 'javax.media', module: 'jai_core'
        exclude group: 'javax.media', module: 'jai_codec'
    }

    // PostgreSQL + PostGIS
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    implementation 'net.postgis:postgis-jdbc:2.5.1'

    // KRAS HTTP 클라이언트
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.3.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    if (file('lib/libgpkiapi_jni.jar').exists()) {
        runtimeOnly files('lib/libgpkiapi_jni.jar')
    }

    // base-tables.xml 파싱
    implementation 'org.jdom:jdom2:2.0.6.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

bootJar {
    archiveFileName = 'geomex-sync.jar'
}

// ── Step 8에서 추가: jlink 최소 JRE 생성 ──────────────────────────────────
tasks.register('createMinimalJre', Exec) {
    // 프로젝트 내 jdk/ 우선, 없으면 JAVA_HOME 사용
    def localJdk = file("${rootDir}/jdk")
    def javaHome = localJdk.exists() ? localJdk.absolutePath : (System.getenv('JAVA_HOME') ?: '')
    def outputDir = layout.buildDirectory.dir('jre').get().asFile

    doFirst {
        if (!javaHome) throw new GradleException('프로젝트 jdk/ 폴더 또는 JAVA_HOME 환경변수를 설정하세요')
        outputDir.deleteDir()
    }

    executable = "${javaHome}/bin/jlink"
    args '--module-path', "${javaHome}/jmods",
         '--add-modules',
         'java.base,java.compiler,java.desktop,java.instrument,java.management,' +
         'java.naming,java.net.http,java.prefs,java.rmi,java.security.jgss,' +
         'java.sql,java.xml,java.logging,jdk.crypto.ec,jdk.management,' +
         'jdk.unsupported,jdk.zipfs',
         '--strip-debug',
         '--compress=2',
         '--no-header-files',
         '--no-man-pages',
         '--output', outputDir.absolutePath
}

// ── Step 8에서 추가: 배포 ZIP 생성 ────────────────────────────────────────
tasks.register('jlinkZip', Zip) {
    dependsOn bootJar, createMinimalJre
    archiveFileName = "geomex-sync-HOME-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')

    from(layout.buildDirectory.dir('libs')) {
        include 'geomex-sync.jar'
        into 'lib'
    }
    from(layout.buildDirectory.dir('jre')) {
        into 'jre'
    }
    from('scripts') {
        into 'bin'
        include '*.bat'
    }
    from('bin') {
        into 'bin'
        include 'nssm.exe'
    }
    from('conf') {
        into 'conf'
    }
    from('lib') {
        into 'lib'
        include 'libgpkiapi_jni.jar'
    }
    from('workspace') {
        into 'workspace'
        include '**/.gitkeep'
    }
    into('KAIS_WORK') {}
    into('logs') {}
}

test {
    useJUnitPlatform()
}
